# Isolated CI fixtures, never the workstation's PostgreSQL data volume.
services:
  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: paulibot_ci
      POSTGRES_USER: paulibot_ci
      POSTGRES_PASSWORD: ci-only-password
    tmpfs: ['/var/lib/postgresql/data']
    volumes:
      - ./scripts/ci_pgvector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paulibot_ci -d paulibot_ci']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: ['python', '-c', 'import time; time.sleep(1800)']
    environment:
      USE_POSTGRES: 'true'
      POSTGRES_DB: paulibot_ci
      POSTGRES_USER: paulibot_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: postgres
      DJANGO_SECRET_KEY: ci-only-non-production-key
      PAULA_GROQ_ENABLED: 'false'
      PAULA_OPENAI_ENABLED: 'false'
      DEBUG: 'true'
    depends_on:
      postgres:
        condition: service_healthy
