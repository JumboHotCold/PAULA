name: PAULA regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated PostgreSQL and web test services
        run: docker compose -p paula-ci -f docker-compose.ci.yml up --build -d
      - name: Django checks and PostgreSQL regression fixtures
        run: |
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web pip check
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web python manage.py check
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web python manage.py makemigrations --check --dry-run
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web python manage.py collectstatic --noinput
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web python manage.py migrate --noinput
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web python scripts/ci_knowledge_gate.py
          docker compose -p paula-ci -f docker-compose.ci.yml exec -T web python manage.py test chatbot --verbosity 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and production bundle
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Frontend transport to isolated Django HTTP integration
        run: |
          docker compose -p paula-ci -f docker-compose.ci.yml exec -d web python manage.py runserver 0.0.0.0:8000 --noreload
          node scripts/verify_stage3_transport.mjs
      - name: Stop isolated test services
        if: always()
        run: docker compose -p paula-ci -f docker-compose.ci.yml down
