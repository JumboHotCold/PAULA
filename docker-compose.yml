# ==============================================================================
# PauliBot Docker Compose Configuration
# ==============================================================================
# Author: Senior Full-Stack Developer & DevOps Engineer
# Purpose: Orchestrate PostgreSQL database and Django application containers
#
# Services:
# 1. postgres - PostgreSQL 16 database with persistent storage
# 2. web - Django application connected to PostgreSQL
#
# Usage:
#   docker-compose up --build -d    # Build and start containers in background
#   docker-compose ps               # Check container status
#   docker-compose logs -f web      # View application logs
#   docker-compose down             # Stop and remove containers
# ==============================================================================

version: '3.8'

services:
  # PostgreSQL Database Service (with pgvector for AI Embeddings)
  postgres:
    # We use a specialized image that includes the pgvector extension pre-installed
    image: ankane/pgvector:v0.5.1
    container_name: paulibot_postgres
    restart: unless-stopped

    environment:
      # Database credentials from .env file
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data

    ports:
      # Expose PostgreSQL port (optional - for debugging)
      - "5432:5432"

    healthcheck:
      # Verify database is ready before starting web service
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - paulibot_network

  # Django Web Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAULA_BUILD_COMMIT: ${PAULA_BUILD_COMMIT:-unknown}
    container_name: paulibot_web
    restart: unless-stopped

    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn paulibot.wsgi:application --config python:paulibot.gunicorn_conf --bind 0.0.0.0:8000 --workers 3 --timeout 120"

    environment:
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # The workspace launcher supplies this explicitly, avoiding host DEBUG values.
      DEBUG: ${PAULA_DJANGO_DEBUG:-${DEBUG}}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      PAULA_FRONTEND_ORIGIN: ${PAULA_FRONTEND_ORIGIN:-}

      # AI API Keys
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Separate override avoids retaining the retired GROQ_MODEL in older env files.
      GROQ_MODEL: ${PAULA_GROQ_MODEL:-openai/gpt-oss-20b}
      PAULA_GROQ_ENABLED: ${PAULA_GROQ_ENABLED:-true}
      # Currently exhausted; opt in only after restoring a usable fallback.
      PAULA_OPENAI_ENABLED: ${PAULA_OPENAI_ENABLED:-false}
      PAULA_GENERATION_DEADLINE_SECONDS: ${PAULA_GENERATION_DEADLINE_SECONDS:-4}
      PAULA_PROVIDER_CALL_TIMEOUT_SECONDS: ${PAULA_PROVIDER_CALL_TIMEOUT_SECONDS:-3}
      PAULA_LOG_UNANSWERED_QUERIES: ${PAULA_LOG_UNANSWERED_QUERIES:-false}
      PAULA_EMBEDDING_REVISION: ${PAULA_EMBEDDING_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
      RAG_MAX_COSINE_DISTANCE: ${RAG_MAX_COSINE_DISTANCE:-0.45}

      # Database connection
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      USE_POSTGRES: ${USE_POSTGRES:-true}

    volumes:
      # Mount application code (for development)
      - .:/app
      # Static files storage
      - static_volume:/app/staticfiles
      # Preserve downloaded embedding models across web-container recreation.
      - model_cache:/root/.cache/huggingface

    ports:
      # Expose Django application port
      - "8080:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-B", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 5

    networks:
      - paulibot_network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  model_cache:
    driver: local

# Network for service communication
networks:
  paulibot_network:
    driver: bridge
